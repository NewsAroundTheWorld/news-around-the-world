<style>
:root{--bg:#EEF1F6;--ink:#121A2B;--mute:#566178;--line:#C6CFDF;--panel:#fff;--acc:#2744D8;--tl:70%;--tx:#121A2B;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--b:'Instrument Sans','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C111C;--ink:#E8ECF5;--mute:#98A3BA;--line:#27324A;--panel:#151C2C;--acc:#8EA2FF;--tl:62%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C111C;--ink:#E8ECF5;--mute:#98A3BA;--line:#27324A;--panel:#151C2C;--acc:#8EA2FF;--tl:62%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--b)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header{padding:40px 0 20px;display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
h1{font:800 clamp(2.2rem,6vw,4.4rem)/.95 var(--d);letter-spacing:-.03em;margin:0;max-width:11em}
.sub{margin:14px 0 0;color:var(--mute);max-width:46ch}
.tg{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--b);cursor:pointer;white-space:nowrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line);padding:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:10px}
input,select{font:400 15px var(--b);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
input{flex:1 1 220px}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--b);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip i{width:11px;height:11px;border-radius:50%;background:hsl(var(--h) 70% 62%)}
.chip small{color:var(--mute);font-weight:400}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
:is(button,input,select,a):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.info{display:flex;justify-content:space-between;gap:12px;color:var(--mute);font-size:14px;margin:18px 0 4px}
.rs{border:0;background:none;color:var(--acc);font:600 14px var(--b);cursor:pointer;padding:0}
h2{font:800 1.5rem/1 var(--d);letter-spacing:-.01em;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
h2 small{font:400 14px var(--b);color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.t{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:132px;padding:12px;border-radius:6px;text-decoration:none;color:var(--tx);background:hsl(var(--h) 72% var(--l));transition:transform .15s}
.tw{position:relative;display:flex;transition:transform .15s}
.tw:hover{transform:translateY(-3px)}
.tw .t{flex:1;min-width:0}
.m{font:800 2.3rem/1 var(--d);letter-spacing:-.04em}
.lg{position:absolute;top:44px;right:10px;font:600 11px var(--b);border:1.5px solid currentColor;border-radius:4px;padding:1px 4px;opacity:.75}
.n{font:600 14px/1.2 var(--b);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c{font-size:12px;opacity:.78;margin-top:3px}
.e{padding:60px 0;text-align:center;color:var(--mute)}
.vw{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--b);color:var(--ink);background:var(--panel);border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab svg{width:15px;height:15px;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.tab small{font-weight:400;opacity:.75}
.tab[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
#ch{flex:1 1 auto}
.fv{position:absolute;top:6px;right:6px;z-index:1;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.5);color:var(--tx);cursor:pointer;padding:0}
.fv:hover{background:rgba(255,255,255,.8)}
.fv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.fv[aria-pressed="true"] svg{fill:currentColor}
.rs+.rs{margin-left:14px}
@media (max-width:560px){.sep{display:none}}
footer{margin:56px 0 40px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;max-width:70ch}
@media (prefers-reduced-motion:reduce){.t,.tw{transition:none}.tw:hover{transform:none}}
@media (max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}header{padding-top:24px}}
.hd{display:flex;gap:22px;align-items:center}
.logo{flex:none;width:clamp(84px,14vw,150px);aspect-ratio:1;--lc:#17597D;background:var(--lc);-webkit-mask:var(--lm) center/contain no-repeat;mask:var(--lm) center/contain no-repeat}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{--lc:#7DB9DD}}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:var(--hd)}}
:root[data-theme="dark"]{--hero:var(--hd)}
.hero{background:linear-gradient(90deg,rgba(4,9,22,.88),rgba(4,9,22,.6) 50%,rgba(4,9,22,.12)),var(--hero) 70% 35%/cover no-repeat;color:#fff}
.hero header{padding:clamp(28px,6vw,72px) 0}
.hero h1{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.hero .sub{color:#E6ECF7}
.hero .logo{background:#CFE9F8}
.e .rs{margin-top:12px}
.publication-mark{display:flex;align-items:center;justify-content:center;width:100%;height:72px;padding:8px 14px;box-sizing:border-box;border-radius:6px;background:white}.publication-mark img{width:min(100%,var(--n,100%));height:min(100%,var(--n,100%));object-fit:contain}.t:has(.publication-mark){gap:10px;min-height:150px}.t .publication-mark~.lg{top:auto;bottom:10px;right:10px;background:rgba(255,255,255,.88);color:#121A2B;opacity:1}.t:has(.publication-mark) .c{padding-right:34px}
/* закреплённые вкладки */
.tab{white-space:nowrap}.vw,.pin{display:contents}
/* ===== Мобильная версия: компактная шапка, ленты фильтров, плитки-иконки ===== */
@media (max-width:700px){
.wrap{padding:0 14px}
.hero header{padding:14px 0;flex-direction:column;align-items:flex-start;gap:8px}
.hero .hd{flex-direction:row;align-items:center;gap:12px}
.hero .logo{width:48px}
.hero h1{font-size:1.55rem;max-width:none}
.hero .sub{margin:3px 0 0;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hr select{padding:5px 10px;font-size:14px}
.tg{padding:6px 12px;font-size:13px}
.bar{position:static;padding:10px 0;border-top:0}
.bar .row{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin:0 -14px;padding:2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar .row::-webkit-scrollbar{display:none}
.bar .row+.row{margin-top:8px}
.bar .row>*,.bar #ch>*{flex:none}
.bar #ch{flex:none;flex-wrap:nowrap;overflow:visible;margin:0;padding:0}
.bar input{flex:0 0 min(68vw,300px);font-size:16px;height:40px;border-radius:999px;padding:0 16px}
.bar select{font-size:16px;height:40px;border-radius:999px;max-width:190px;padding:0 14px}
.sep{display:none}
.info{margin:10px 0 0}
h2{margin:20px 0 10px;font-size:1.3rem}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.grid .tw .t{min-height:0;justify-content:flex-start;gap:6px;padding:6px 6px 9px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-align:center}
.grid .tw:hover{transform:none}
.grid .tw .t .m{display:grid;place-items:center;width:100%;height:auto;aspect-ratio:1;border-radius:12px;background:hsl(var(--h) 72% var(--l));color:var(--tx);font-size:1.9rem}
.grid .tw .t .publication-mark{display:flex;height:auto;aspect-ratio:1;padding:12%;border-radius:12px;background:#fff}
.grid .tw .t:has(.publication-mark){gap:6px;min-height:0}
.grid .tw .t .n{font-size:12.5px;line-height:1.2;padding:0 2px}
.grid .tw .t .c,.grid .tw .t:has(.publication-mark) .c{font-size:11px;margin-top:0;padding:0 2px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .tw .t .lg{top:10px;left:10px;right:auto;bottom:auto;font-size:9px;padding:0 3px;border-width:1px;background:rgba(255,255,255,.9);color:#121A2B;opacity:1}
.fv{top:10px;right:10px;width:26px;height:26px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.fv svg{width:16px;height:16px}
}

/* звезда без круга */
.fv,.fv:hover{background:none;box-shadow:none;border-radius:0}
.fv svg{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.85))}
.fv:hover svg{transform:scale(1.15)}
/* плитки-«клавиши» */
.tw .t{background-image:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0) 42%,rgba(0,0,0,.07));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 1px 0 0 rgba(255,255,255,.2),inset -1px 0 0 rgba(0,0,0,.08),inset 0 -4px 0 rgba(0,0,0,.16),0 3px 5px rgba(16,26,46,.22),0 1px 1px rgba(16,26,46,.28);transition:transform .15s,box-shadow .15s}
.grid .tw .t{background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 40%,rgba(0,0,0,.06))}
.tw:hover .t{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 1px 0 0 rgba(255,255,255,.2),inset -1px 0 0 rgba(0,0,0,.08),inset 0 -4px 0 rgba(0,0,0,.16),0 7px 12px rgba(16,26,46,.26),0 1px 1px rgba(16,26,46,.28)}
.tw:active .t{transform:translateY(2px);box-shadow:inset 0 2px 3px rgba(0,0,0,.2),0 1px 1px rgba(16,26,46,.25)}
@media (prefers-reduced-motion:reduce){.tw .t{transition:none}.tw:active .t{transform:none}}

/* ===== Премиальное стекло (Premium Glass UI) для плиток изданий ===== */
:root{--glass-blur:24px}
.grid .tw .t{color:#0D1B2A;isolation:isolate;
--gA:hsl(var(--h) 88% calc(var(--l) + 3%) / .92);--gB:hsl(var(--h) 76% calc(var(--l) - 9%) / .94);
background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 38%,rgba(10,20,50,.12) 100%),linear-gradient(145deg,var(--gA),var(--gB));
-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);backdrop-filter:blur(var(--glass-blur)) saturate(160%);

ar:["دليل وسائل الإعلام: {n} مصدرًا من دول ومناطق العالم.","ابحث عن وسيلة إعلام أو دولة أو موقع","كل الدول","كل اللغات","كل الأنواع","التجميع: القارات","التجميع: الدول","الوضع الداكن","الوضع الفاتح","المفضلة","تمت زيارتها مؤخرًا","مسح السجل","إعادة ضبط الفلاتر","تم العثور على: {a} من {b}","لا توجد عناصر في المفضلة بعد. اضغط على النجمة في بطاقة وسيلة الإعلام لإضافتها هنا. تُحفظ المفضلة في هذا المتصفح.","لم تفتح شيئًا بعد. ستظهر هنا وسائل الإعلام التي تزور مواقعها من الدليل.","لم يتم العثور على شيء. غيّر البحث أو أعد ضبط الفلاتر.","إضافة إلى المفضلة","إزالة من المفضلة","حكومية","أخرى","نعمل لأسباب إنسانية بحتة: لإتاحة أخبار العالم كله للعالم كله. المعلومات مأخوذة من مصادر مفتوحة. هذا الدليل لا يحلّ محل أي وسيلة إعلامية يضع رابطًا إليها: فهو لا ينشر موادها، بل يوجّه القارئ إلى مواقعها الرسمية فقط. الدليل غير مرتبط بالوسائل الإعلامية المذكورة، وجميع الأسماء والحقوق تعود لأصحابها. قد تحتوي البيانات على أخطاء.","صحيفة","مجلة","وكالة أنباء","موقع إلكتروني","إذاعة","تلفزيون","تلفزيون / إنترنت","إقليمية إفريقية (عدة دول)","لا توجد في المفضلة وسائل إعلام تطابق الفلاتر المحددة.","لا توجد وسائل إعلام تمت زيارتها مؤخرًا تطابق الفلاتر المحددة.","عرض كل المفضلة","عرض كل ما تمت زيارته مؤخرًا","عدة لغات","أوروبية عامة (عدة دول)","يضم الدليل {n} مصدرًا","تم العثور على: {a}"],
bn:["সংবাদমাধ্যমের ক্যাটালগ: বিশ্বের দেশ ও অঞ্চল জুড়ে {n}টি উৎস।","মাধ্যম, দেশ বা সাইট খুঁজুন","সব দেশ","সব ভাষা","সব ধরন","গ্রুপ: মহাদেশ","গ্রুপ: দেশ","ডার্ক থিম","লাইট থিম","প্রিয়","সম্প্রতি দেখা","ইতিহাস মুছুন","ফিল্টার রিসেট করুন","পাওয়া গেছে: {b}-এর মধ্যে {a}","প্রিয় তালিকা এখনো খালি। এখানে যোগ করতে কোনো মাধ্যমের টাইলে তারকা চিহ্নে চাপ দিন। প্রিয় তালিকা এই ব্রাউজারেই সংরক্ষিত থাকে।","এখনো কিছু খোলা হয়নি। ক্যাটালগ থেকে যেসব মাধ্যমের সাইটে যাবেন, সেগুলো এখানে দেখা যাবে।","কিছু পাওয়া যায়নি। অনুসন্ধান বদলান বা ফিল্টার রিসেট করুন।","প্রিয়তে যোগ করুন","প্রিয় থেকে সরান","সরকারি","অন্যান্য","আমরা কেবল মানবিক কারণে কাজ করছি: সারা বিশ্বের খবর সারা বিশ্বের মানুষের কাছে পৌঁছে দিতে। তথ্য উন্মুক্ত উৎস থেকে নেওয়া। এই ক্যাটালগ যেসব সংবাদমাধ্যমের লিংক দেয়, তাদের কোনোটির বিকল্প নয়: এটি তাদের কোনো কনটেন্ট প্রকাশ করে না, শুধু পাঠকদের তাদের অফিসিয়াল ওয়েবসাইটে নিয়ে যায়। ক্যাটালগটি তালিকাভুক্ত সংবাদমাধ্যমগুলোর সঙ্গে যুক্ত নয়; সব নাম ও অধিকার তাদের মালিকদের। তথ্যে ভুল থাকতে পারে।","সংবাদপত্র","ম্যাগাজিন","সংবাদ সংস্থা","অনলাইন মাধ্যম","রেডিও","টিভি","টিভি / অনলাইন","প্যান-আফ্রিকান (একাধিক দেশ)","নির্বাচিত ফিল্টারের সঙ্গে মেলে এমন কোনো প্রিয় মাধ্যম নেই।","নির্বাচিত ফিল্টারের সঙ্গে মেলে এমন কোনো সম্প্রতি দেখা মাধ্যম নেই।","সব প্রিয় দেখান","সব সম্প্রতি দেখা দেখান","একাধিক ভাষা","প্যান-ইউরোপীয় (একাধিক দেশ)","ক্যাটালগে {n}টি উৎস আছে","পাওয়া গেছে: {a}"],
